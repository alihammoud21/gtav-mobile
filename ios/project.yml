# muguet - project.yml
# Constantin Clerc (c22dev) - 0.1

name: GTAVMobile
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  GTAVMobile:
    type: application
    platform: iOS
    sources:
      - path: stub.c
      - path: ../assets/muguet.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alihammoud21.gtavmobile.ios
        PRODUCT_NAME: GTAVMobile
        EXECUTABLE_NAME: gtav-mobile
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: GTAVMobile.entitlements
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: muguet
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: NO
        STRIP_INSTALLED_PRODUCT: NO
        DEBUG_INFORMATION_FORMAT: dwarf
    postBuildScripts:
      - name: Use the Rust executable
        basedOnDependencyAnalysis: false
        script: |
          set -e
          xcrun vtool -set-build-version ios 15.0 26.0 -replace -output "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" \
            "$SRCROOT/../target/ios/aarch64-apple-ios/release/gtav-mobile"
