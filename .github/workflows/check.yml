name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install Rust and iOS target
        run: rustup toolchain install 1.98.1 --profile minimal --target aarch64-apple-ios
      - run: cargo test --locked --all-targets
      - run: cargo check --locked --no-default-features --target aarch64-apple-ios --bin gtav-mobile
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Rust and SDK
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target aarch64-linux-android
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
      - run: ./make-android.sh
      - run: ./android/gradlew -p android lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: gtav-mobile-debug
          path: build/gtav-mobile-debug.apk
